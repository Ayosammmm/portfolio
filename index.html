<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Ayosammmm</title>

    <!--
      Polices auto-hébergées (public/fonts, sous-ensemble latin).
      Le preload les place en tête de file réseau, avant CSS / JS / images.
      Seules les graisses les plus utilisées sont préchargées ; les autres
      (100, 200, 700, 300 italique) se chargent à la demande.
    -->
    <link rel="preload" href="/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-300.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fugaz-one-400.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Fugaz One'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/fugaz-one-400.woff2) format('woff2'); }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 100; font-display: swap; src: url(/fonts/poppins-100.woff2) format('woff2'); }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 200; font-display: swap; src: url(/fonts/poppins-200.woff2) format('woff2'); }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 300; font-display: swap; src: url(/fonts/poppins-300.woff2) format('woff2'); }
      @font-face { font-family: 'Poppins'; font-style: italic; font-weight: 300; font-display: swap; src: url(/fonts/poppins-300-italic.woff2) format('woff2'); }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/poppins-400.woff2) format('woff2'); }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/poppins-500.woff2) format('woff2'); }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 700; font-display: swap; src: url(/fonts/poppins-700.woff2) format('woff2'); }
    </style>
    <!--
      Styles du loader en ligne : ils s'appliquent dès la réception du HTML,
      avant le téléchargement du CSS, des polices et du JS de l'application.
      App.jsx ajoute la classe "loaded" quand le site est prêt, puis retire le loader.
    -->
    <style>
      /* Fond uniquement sur <html> : un fond sur <body> recouvrirait le
         background animé (.fixed-bg en z-index -1, peint sous les blocs). */
      html { background: #000; }
      body { margin: 0; }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 1001;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111;
        color: #eee;
        /* Poppins préchargée ; police système en attendant (quelques ms) */
        font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
        opacity: 1;
        transition: opacity 0.5s cubic-bezier(.5, 0, .1, .99);
      }
      #loader.loaded {
        opacity: 0;
        pointer-events: none;
      }
    </style>

  </head>
  <body>
    <div id="loader">Chargement...</div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
